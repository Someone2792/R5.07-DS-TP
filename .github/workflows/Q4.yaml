
name: Q4 - Archive informations

on: [push]

jobs:
  Archivage-Q4:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Création de Q4_archive_[date].txt
        run: |
          DATE=$(date +%d-%m-%Y)
          echo "Thibault Padois" > Q4_archive_$DATE.txt
          cat Q4.java >> Q4_archive_$DATE.txt

      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q4_archive_*.txt
          git commit -m "Ajout archive Q4"
          git push
